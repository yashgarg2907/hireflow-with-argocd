name: Build Push and Deploy

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read
packages: write

env:
REGISTRY: ghcr.io
IMAGE_OWNER: yashgarg2907
GITOPS_REPO: yashgarg2907/hireflow-gitops
BACKEND_IMAGE: ghcr.io/yashgarg2907/hireflow-backend
FRONTEND_IMAGE: ghcr.io/yashgarg2907/hireflow-frontend

jobs:

docker:
name: Build and Push Images
runs-on: ubuntu-latest

outputs:
  build_tag: ${{ steps.image-tag.outputs.build_tag }}
  sha_tag: ${{ steps.image-tag.outputs.sha_tag }}

steps:

  - name: Checkout source repository
    uses: actions/checkout@v6

  - name: Generate image tags
    id: image-tag
    run: |
      echo "build_tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      echo "sha_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  - name: Display image tags
    run: |
      echo "Build tag: build-${{ github.run_number }}"
      echo "SHA tag: ${GITHUB_SHA}"

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v4

  - name: Log in to GitHub Container Registry
    uses: docker/login-action@v4
    with:
      registry: ${{ env.REGISTRY }}
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  - name: Build and push backend
    uses: docker/build-push-action@v7
    with:
      context: ./backend
      file: ./backend/Dockerfile
      push: true
      tags: |
        ${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.build_tag }}
        ${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.sha_tag }}

  - name: Build and push frontend
    uses: docker/build-push-action@v7
    with:
      context: ./frontend
      file: ./frontend/Dockerfile
      push: true
      build-args: |
        VITE_API_URL=${{ vars.VITE_API_URL }}
      tags: |
        ${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.build_tag }}
        ${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.sha_tag }}

  - name: Print published images
    run: |
      echo "============================================"
      echo "IMAGES PUBLISHED"
      echo "============================================"
      echo ""
      echo "Backend:"
      echo "${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.build_tag }}"
      echo "${{ env.BACKEND_IMAGE }}:${{ steps.image-tag.outputs.sha_tag }}"
      echo ""
      echo "Frontend:"
      echo "${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.build_tag }}"
      echo "${{ env.FRONTEND_IMAGE }}:${{ steps.image-tag.outputs.sha_tag }}"

update-gitops:
name: Update GitOps Repository
needs: docker
runs-on: ubuntu-latest

steps:

  - name: Checkout GitOps repository
    uses: actions/checkout@v6
    with:
      repository: ${{ env.GITOPS_REPO }}
      token: ${{ secrets.GITOPS_TOKEN }}
      path: gitops
      ref: main
      fetch-depth: 0

  - name: Configure Git identity
    working-directory: gitops
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

  - name: Update backend image
    working-directory: gitops
    run: |
      sed -i "s|image: ghcr.io/yashgarg2907/hireflow-backend:.*|image: ghcr.io/yashgarg2907/hireflow-backend:${{ needs.docker.outputs.build_tag }}|" k8s/backend-deployment.yaml

  - name: Update frontend image
    working-directory: gitops
    run: |
      sed -i "s|image: ghcr.io/yashgarg2907/hireflow-frontend:.*|image: ghcr.io/yashgarg2907/hireflow-frontend:${{ needs.docker.outputs.build_tag }}|" k8s/frontend-deployment.yaml

  - name: Show GitOps changes
    working-directory: gitops
    run: |
      git diff

  - name: Commit GitOps changes
    working-directory: gitops
    run: |
      git add k8s/backend-deployment.yaml k8s/frontend-deployment.yaml

      if git diff --cached --quiet; then
        echo "No GitOps changes detected."
        exit 0
      fi

      git commit -m "deploy: build ${{ needs.docker.outputs.build_tag }}"

  - name: Push GitOps changes
    working-directory: gitops
    run: |
      git push origin main

  - name: Deployment summary
    run: |
      echo "============================================"
      echo "GITOPS DEPLOYMENT TRIGGERED"
      echo "============================================"
      echo ""
      echo "Backend: ${{ env.BACKEND_IMAGE }}:${{ needs.docker.outputs.build_tag }}"
      echo "Frontend: ${{ env.FRONTEND_IMAGE }}:${{ needs.docker.outputs.build_tag }}"
      echo ""
      echo "Argo CD will detect the GitOps commit."
      echo "Rollback is possible by reverting the GitOps commit."
